name: Weekly link check

# The site's one promise is that its entries are current. This is what keeps
# that promise true between manual reviews: every Monday it re-checks all 80
# application links and files an issue listing anything broken or stale.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:       # and on demand, from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Probe every application link
        id: probe
        continue-on-error: true       # a broken link should file an issue, not just go red
        env:
          REPORT_PATH: link-report.md
        run: node scripts/check-links.mjs

      - name: Open an issue when something needs a human
        if: steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('link-report.md', 'utf8');
            const title = `Link check: broken or stale entries (${new Date().toISOString().slice(0,10)})`;

            // Reuse the open issue rather than filing a new one every week.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'stale-data',
            });
            const existing = open.find(i => i.title.startsWith('Link check:'));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, title, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['stale-data'],
              });
            }

      - name: Publish the report in the run summary
        if: always()
        run: cat link-report.md >> "$GITHUB_STEP_SUMMARY"
