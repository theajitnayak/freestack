name: Daily terms check

# check-links.yml asks whether the application links still resolve. This asks
# whether the pages still SAY what we publish — the amount, the eligibility bar,
# whether the programme is still open. That is the claim the site is built on,
# and it is the one that decays silently.
#
# Runs daily at 08:00 IST so a change is visible the next morning, not next
# week. The report reuses one open issue rather than filing a new one daily.
on:
  schedule:
    # 02:30 UTC = 08:00 IST, every day. Daily rather than weekly because a
    # scheme that changed on Thursday should not sit unnoticed until the
    # following Wednesday - by then the deadline may have passed and the
    # advantage of noticing first is gone.
    #
    # 02:30 rather than 02:00: GitHub queues scheduled jobs at the top of the
    # hour and runs at :00 are routinely delayed by 10-30 minutes.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated programme ids (blank = all 80)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  id-token: write          # required for Workload Identity Federation

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Several government portals are client-rendered and hand a plain fetch an
      # empty shell, so the check falls back to a real browser for those pages.
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Exchanges the run's OIDC token for GCP credentials. No long-lived key
      # lives in this repo. See the setup notes in scripts/check-terms.mjs.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Re-read every programme page
        id: terms
        continue-on-error: true      # drift should open an issue, not just go red
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: us-central1
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          REPORT_PATH: terms-report.md
          ONLY: ${{ inputs.only }}
        run: node scripts/check-terms.mjs

      - name: Open an issue when terms appear to have moved
        if: steps.terms.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('terms-report.md', 'utf8');
            const title = `Terms check: programmes may have changed (${new Date().toISOString().slice(0,10)})`;

            // Reuse the open issue rather than filing a new one every week.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'stale-data',
            });
            const existing = open.find(i => i.title.startsWith("Terms check:"));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, title, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['stale-data'],
              });
            }

      - name: Publish the report in the run summary
        if: always()
        run: cat terms-report.md >> "$GITHUB_STEP_SUMMARY"
